<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drivers · Parth's Pit Wall</title>
  <meta name="description" content="F1 2026 driver profiles with career statistics and season history — Parth's Pit Wall.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    :root {
      /* Bright Track Backgrounds */
      --carbon: #F4EEE4;
      --carbon-2: #E7DFD1;
      --carbon-3: rgba(17, 17, 19, 0.05);
      --paper: #FBF8F2;
      --paper-2: #F1EBE0;
      --paper-3: rgba(17, 17, 19, 0.04);
      --card-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(248, 240, 228, 0.92) 100%);

      /* Text Colors */
      --ink: #101114;
      --ink-2: #5E5A56;
      --ink-3: #8D857B;

      /* Accents */
      --racing: #FF3B30;
      --racing-hot: #FF5B50;
      --racing-deep: #b30400;
      --gold: #D4AF37;

      /* Telemetry Team Accents */
      --mercedes: #00D2BE;
      --ferrari: #FF3B30;
      --mclaren: #FF8000;
      --redbull: #3671C6;
      --williams: #64C4FF;
      --haas: #B6BABD;
      --alpine: #0093CC;
      --audi: #00877C;
      --racingbulls: #6692FF;
      --aston: #00A86B;
      --cadillac: #8A9099;

      /* Rules & Dividers */
      --rule-light: rgba(17, 17, 19, 0.09);
      --rule-dark: rgba(17, 17, 19, 0.14);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(17, 17, 19, 0.08);
      border-radius: 18px;
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
    }

    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes fadeUpSlow {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlow { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    html { scroll-behavior: smooth; }

    /* ── Step 13: GSAP & View Transitions Smooth Navigation ── */
    @view-transition {
      navigation: auto;
    }
    @keyframes pageEnter {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.985);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
    @keyframes pageExit {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translateY(-32px) scale(0.985);
        filter: blur(4px);
      }
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      animation: pageEnter 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    body.page-exiting {
      animation: pageExit 0.38s cubic-bezier(0.4, 0, 1, 1) both !important;
    }

    /* ── Animated Telemetry Background ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      animation: moveGrid 20s linear infinite;
    }

    @keyframes moveGrid {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    .telemetry-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .telemetry-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 210, 190, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 190, 0.03) 1px, transparent 1px);
      background-size: 160px 160px;
      animation: moveGridMajor 36s linear infinite;
    }
    @keyframes moveGridMajor {
      0% { background-position: 0 0; }
      100% { background-position: 160px 160px; }
    }
    @keyframes scanLine {
      0%   { transform: translateY(-150px); }
      100% { transform: translateY(100vh); }
    }
    .telemetry-scan {
      position: absolute;
      left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 210, 190, 0.05) 50%, transparent 100%);
      animation: scanLine 8s linear infinite;
    }
    .telemetry-scan-2 {
      animation-delay: 4s;
      height: 100px;
      background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.05) 50%, transparent 100%);
      animation-duration: 12s;
    }

    /* ── NAV ── */
    .site-nav {
      background: var(--carbon);
      height: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky;
      top: 0;
      z-index: 200;
      animation: fadeSlow 0.5s ease both;
    }
    .nav-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 36px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-checker {
      width: 26px; height: 16px;
      background:
        linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
        linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
      background-size: 6px 6px;
      background-position: 0 0, 3px 3px;
      background-color: #000;
      flex-shrink: 0;
    }
    .nav-brand-text {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .nav-brand-text em { color: var(--racing-hot); }
    .nav-links { display: flex; height: 100%; }
    .nav-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      padding: 0 18px;
      display: flex;
      align-items: center;
      position: relative;
      transition: color 0.2s;
      height: 100%;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--gold, #D4AF37);
      box-shadow: 0 0 8px var(--gold, #D4AF37);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-link:hover { color: rgba(255,255,255,0.9); }
    .nav-link:hover::after { width: 100%; }
    .nav-link.active { color: var(--gold, #D4AF37); text-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }
    .nav-link.active::after { width: 100%; background: var(--gold, #D4AF37); box-shadow: 0 0 10px var(--gold, #D4AF37); }

    /* ── TICKER ── */
    .ticker-wrap {
      background: var(--carbon);
      height: 44px;
      overflow: hidden;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--racing);
      position: relative;
      animation: fadeSlow 0.9s ease both;
    }
    .ticker-wrap::before, .ticker-wrap::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 80px;
      z-index: 2;
      pointer-events: none;
    }
    .ticker-wrap::before { left: 85px; background: linear-gradient(90deg, var(--carbon), transparent); }
    .ticker-wrap::after  { right: 0; background: linear-gradient(270deg, var(--carbon), transparent); }

    .ticker-live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid rgba(255, 59, 48, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      margin-left: 16px;
      margin-right: 16px;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #FF3B30;
      border-radius: 50%;
      box-shadow: 0 0 8px #FF3B30;
      animation: pulse 1s infinite;
    }

    .live-badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.12em;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .ticker-track {
      display: flex;
      white-space: nowrap;
      animation: ticker 52s linear infinite;
      will-change: transform;
    }
    .ticker-track:hover { animation-play-state: paused; }
    .tick {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 26px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
    }
    .tick .sym { color: var(--racing-hot); font-weight: 600; letter-spacing: .14em; }
    .tick .val { color: #fff; font-weight: 600; }
    .tick-dot { color: rgba(255,255,255,.2); padding: 0 4px; font-size: 9px; }

    /* ── HERO ── */
    .drivers-hero {
      max-width: 1440px;
      margin: 0 auto;
      padding: 52px 36px 36px;
      animation: fadeUpSlow 0.8s ease both 0.2s;
    }
    .drivers-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--racing);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .drivers-eyebrow::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--racing);
      border-radius: 50%;
      animation: pulseDot 1.8s ease infinite;
    }
    .drivers-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(44px, 7vw, 96px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 0.95;
      margin-bottom: 20px;
    }
    .drivers-title em { font-style: italic; color: var(--racing); font-weight: 500; }
    .drivers-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-3);
      border-top: 1px solid var(--rule-light);
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drivers-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--ink-3);
    }

    /* ── DRIVER GRID ── */
    .drivers-grid-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 36px 60px;
    }
    .drivers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      perspective: 1200px;
    }

    /* ── DRIVER CARD (Hero Style) ── */
    .driver-card {
      background: linear-gradient(145deg, var(--card-bg, rgba(255, 255, 255, 0.03)), color-mix(in srgb, var(--team-color, transparent) 8%, rgba(255, 255, 255, 0.01)));
      border: 1px solid var(--rule-light);
      border-top: 3px solid var(--team-color, var(--ink-3));
      padding: 24px 22px 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(.16,1,.3,1), box-shadow 0.4s cubic-bezier(.16,1,.3,1), border-color 0.4s ease, background 0.4s ease;
      opacity: 0;
      animation: cardReveal 0.5s cubic-bezier(.25,.9,.3,1) both;
      will-change: transform;
    }
    /* Glowing Border Accent */
    .driver-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border: 2px solid var(--team-color, transparent);
      box-shadow: 0 0 22px var(--team-color, transparent), inset 0 0 15px color-mix(in srgb, var(--team-color, #000) 30%, transparent);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(.16,1,.3,1), box-shadow 0.35s ease;
      pointer-events: none;
      z-index: 2;
    }
    .driver-card:hover::before {
      opacity: 1;
    }
    .driver-card:hover {
      transform: rotateX(4deg) rotateY(-4deg);
      box-shadow:
        0 16px 48px rgba(0,0,0,0.45),
        0 0 32px color-mix(in srgb, var(--team-color, #888) 45%, transparent);
      border-color: var(--team-color, var(--rule-light));
      background: linear-gradient(145deg, var(--card-bg, rgba(255, 255, 255, 0.05)), color-mix(in srgb, var(--team-color, transparent) 16%, rgba(255, 255, 255, 0.02)));
    }
    .driver-card.is-favorite {
      border-color: var(--gold);
      border-top-color: var(--gold);
    }
    .driver-card.is-favorite::after {
      content: '★';
      position: absolute;
      top: 12px;
      right: 14px;
      color: var(--gold);
      font-size: 13px;
      z-index: 1;
    }

    /* Driver Image */
    .dc-image {
      position: absolute;
      bottom: -10px;
      right: -20px;
      height: 230px;
      object-fit: contain;
      object-position: bottom right;
      z-index: 0;
      opacity: 1;
      pointer-events: none;
      filter: drop-shadow(-5px 5px 15px rgba(0,0,0,0.25));
      transition: transform 0.4s cubic-bezier(.16,1,.3,1);
    }
    .driver-card:hover .dc-image {
      transform: scale(1.06) translateX(-5px) translateZ(20px);
    }

    /* Big driver number (Hero style) */
    .dc-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 64px;
      font-weight: 800;
      color: var(--team-color, var(--ink-3));
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
      opacity: 0.85;
      position: relative;
      z-index: 1;
      text-shadow: 0 4px 15px color-mix(in srgb, var(--team-color, #000) 25%, transparent);
      transition: transform 0.4s cubic-bezier(.16,1,.3,1), opacity 0.35s, text-shadow 0.35s, filter 0.35s;
    }
    .driver-card:hover .dc-number {
      transform: translateY(-6px) scale(1.08) translateZ(15px);
      opacity: 1;
      text-shadow: 0 6px 22px color-mix(in srgb, var(--team-color, #000) 50%, transparent);
      filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--team-color, #888) 50%, transparent));
    }

    /* 3-letter code badge */
    .dc-code {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      background: var(--team-color, var(--ink-3));
      padding: 3px 7px;
      letter-spacing: .08em;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .dc-name {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .dc-team {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.01em;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .dc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 11px;
      border-top: 1px solid var(--rule-light);
      position: relative;
      z-index: 1;
    }
    .dc-pos-pts {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: .03em;
    }
    .dc-pos-pts .dc-pts { color: var(--ink-3); font-size: 14px; font-weight: 600; margin-left: 4px; }
    @keyframes starPop {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.4); filter: brightness(1.5); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .dc-fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      opacity: 0.3;
      transition: opacity 0.2s, transform 0.2s;
      padding: 4px 2px;
      line-height: 1;
      color: var(--gold);
    }
    .dc-fav-btn:hover  { opacity: 0.7; transform: scale(1.2); }
    .dc-fav-btn.active { opacity: 1; animation: starPop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }

    /* Card hover arrow */
    .dc-view-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--team-color, var(--ink));
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-align: center;
      padding: 7px;
      font-weight: 600;
      transform: translateY(100%);
      transition: transform 0.22s ease;
    }
    .driver-card:hover .dc-view-hint { transform: translateY(0); }

    /* ── LOADING / EMPTY STATES ── */
    .grid-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── DRIVER DETAIL MODAL ── */
    .driver-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .driver-modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .driver-modal {
      background: var(--carbon);
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      border-top: 4px solid var(--racing);
      position: relative;
      transform: translateY(32px) scale(0.98);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .driver-modal-overlay.open .driver-modal {
      transform: translateY(0) scale(1);
    }

    /* Modal header hero */
    .dm-hero {
      padding: 32px 40px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .dm-hero-num {
      position: absolute;
      right: 28px;
      bottom: -10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: rgba(255,255,255,0.05);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
    }
    .dm-close-btn {
      position: absolute;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 2;
    }
    .dm-close-btn:hover { background: var(--racing); }
    .dm-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--racing-hot);
      font-weight: 600;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .dm-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(30px, 5vw, 50px);
      font-weight: 700;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .dm-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      position: relative;
      z-index: 1;
    }
    .dm-meta-item { display: flex; align-items: center; gap: 6px; }
    .dm-meta-dot {
      width: 5px; height: 5px;
      background: var(--racing);
      border-radius: 50%;
    }

    /* Modal body */
    .dm-body { padding: 28px 40px 36px; }

    .dm-bio {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-style: italic;
      line-height: 1.75;
      color: rgba(255,255,255,0.55);
      border-left: 2px solid var(--racing);
      padding-left: 18px;
      margin-bottom: 32px;
    }

    .dm-section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Career stat cells */
    .dm-stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 32px;
    }
    .dm-stat-cell {
      background: var(--carbon-3);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 16px 14px 14px;
      text-align: center;
    }
    .dm-stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 7px;
      letter-spacing: -0.02em;
    }
    .dm-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      font-weight: 600;
    }

    /* Season history */
    .dm-history-table {
      width: 100%;
      border-collapse: collapse;
    }
    .dm-history-table th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      padding: 0 0 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-weight: 600;
    }
    .dm-history-table td {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      vertical-align: middle;
    }
    .dm-history-table tr:last-child td { border-bottom: none; }
    .dm-season-year {
      font-weight: 700;
      color: #fff;
      letter-spacing: .04em;
    }
    .dm-season-team { color: rgba(255,255,255,0.45); padding-right: 16px; }
    .dm-season-pos {
      font-weight: 700;
      letter-spacing: .06em;
      text-align: right;
    }
    .dm-pos-1 { color: var(--gold); }
    .dm-pos-2 { color: #c0c0c0; }
    .dm-pos-3 { color: #cd7f32; }
    .dm-season-pts { text-align: right; color: rgba(255,255,255,0.5); }

    /* Skeleton Loading State */
    .dm-loading {
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    @keyframes skeletonShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-line, .skeleton-label, .skeleton-box {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 2s infinite linear;
      border-radius: 4px;
    }
    .skeleton-line { height: 14px; margin-bottom: 12px; }
    .skeleton-label { height: 11px; width: 120px; margin-bottom: -16px; }
    .skeleton-box { height: 74px; border-radius: 8px; }

    /* ── FOOTER ── */
    .footer-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 36px 40px;
    }
    .footer {
      border-top: 1px solid var(--rule-light);
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .f-note {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--ink-3);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .f-dot {
      display: inline-block;
      width: 4px; height: 4px;
      background: var(--racing);
      vertical-align: middle;
      margin: 0 8px;
      border-radius: 50%;
      position: relative;
      top: -2px;
    }
    .f-brand { font-family: 'Playfair Display', serif; font-size: 15px; font-style: italic; color: var(--ink-2); }
    .f-brand em { color: var(--racing); font-weight: 500; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1200px) {
      .drivers-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 980px) {
      .drivers-hero, .drivers-grid-wrap, .footer-wrap { padding-left: 20px; padding-right: 20px; }
      .drivers-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .dm-stats-grid { grid-template-columns: repeat(3, 1fr); }
      .nav-inner { padding: 0 20px; }
      .dm-hero { padding: 24px 24px 20px; }
      .dm-body { padding: 22px 24px 28px; }
    }
    @media (max-width: 540px) {
      .drivers-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .dc-number { font-size: 40px; }
      .dc-name { font-size: 20px; }
      .dc-team { font-size: 13px; }
      .dc-pos-pts { font-size: 14px; }
      .dc-pos-pts .dc-pts { font-size: 12px; }
      .dm-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-link { padding: 0 12px; font-size: 9px; }
    }
    /* ── Telemetry Glow Effects (Step 7) ── */
    .driver-row.leader .driver-pos,
    .con-row.leader .con-pos,
    .driver-row.leader .driver-pts,
    .con-row.leader .con-pts,
    .driver-card.leader .dc-number,
    .driver-card.leader .dc-pos-pts,
    .team-card.leader .dc-number,
    .team-card.leader .dc-pos-pts,
    .dm-stat-num.leader,
    .tc-bar-fill.leader,
    .rm-rpos.p1,
    .pod-row.p1 .pod-badge,
    .pod-row.p1 .pod-name {
      color: #D4AF37 !important;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.8), 0 0 24px rgba(212, 175, 55, 0.4) !important;
      border-color: rgba(212, 175, 55, 0.5);
    }

    .fastest-lap,
    .fastest-lap *,
    .dm-stat-num.fastest-lap {
      color: #df99df !important;
      text-shadow: 0 0 12px rgba(223, 153, 223, 0.8), 0 0 25px rgba(223, 153, 223, 0.4) !important;
    }

    @keyframes telemetryPulseGlow {
      0% { text-shadow: 0 0 10px rgba(212, 175, 55, 0.6), 0 0 20px rgba(212, 175, 55, 0.3); }
      50% { text-shadow: 0 0 18px rgba(212, 175, 55, 0.95), 0 0 35px rgba(212, 175, 55, 0.6); }
      100% { text-shadow: 0 0 10px rgba(212, 175, 55, 0.6), 0 0 20px rgba(212, 175, 55, 0.3); }
    }

    .driver-row.leader .driver-pos,
    .con-row.leader .con-pos,
    .rm-rpos.p1 {
      animation: telemetryPulseGlow 2.5s infinite ease-in-out;
    }

    /* ── Team Accent Borders & Glows (Step 10) ── */
    .ferrari {
      border-left: 4px solid #FF2800 !important;
      box-shadow: -4px 0 16px -2px rgba(255, 40, 0, 0.5) !important;
    }
    .mercedes {
      border-left: 4px solid #00D2BE !important;
      box-shadow: -4px 0 16px -2px rgba(0, 210, 190, 0.5) !important;
    }
    .mclaren {
      border-left: 4px solid #FF8000 !important;
      box-shadow: -4px 0 16px -2px rgba(255, 128, 0, 0.5) !important;
    }
    .red_bull, .red-bull {
      border-left: 4px solid #3671C6 !important;
      box-shadow: -4px 0 16px -2px rgba(54, 113, 198, 0.5) !important;
    }
    .aston_martin, .aston-martin {
      border-left: 4px solid #00A86B !important;
      box-shadow: -4px 0 16px -2px rgba(0, 168, 107, 0.5) !important;
    }
    .alpine {
      border-left: 4px solid #0093cc !important;
      box-shadow: -4px 0 16px -2px rgba(0, 147, 204, 0.5) !important;
    }
    .williams {
      border-left: 4px solid #64C4FF !important;
      box-shadow: -4px 0 16px -2px rgba(100, 196, 255, 0.5) !important;
    }
    .rb, .racing_bulls {
      border-left: 4px solid #6692FF !important;
      box-shadow: -4px 0 16px -2px rgba(102, 146, 255, 0.5) !important;
    }
    .haas {
      border-left: 4px solid #B6BABD !important;
      box-shadow: -4px 0 16px -2px rgba(182, 186, 189, 0.5) !important;
    }
    .audi, .sauber {
      border-left: 4px solid #F50537 !important;
      box-shadow: -4px 0 16px -2px rgba(245, 5, 55, 0.5) !important;
    }
    .cadillac {
      border-left: 4px solid #FFB800 !important;
      box-shadow: -4px 0 16px -2px rgba(255, 184, 0, 0.5) !important;
    }

    /* ── Phase 6 Step 11: Animated Progress Bars & Leader Pulse ── */
    .progress-bar,
    .con-bar-fill,
    .tc-bar-fill {
      transition: width 1.5s ease, box-shadow 0.6s ease, filter 0.6s ease !important;
      animation: progressGrowGlow 1.8s cubic-bezier(.2,.8,.2,1) forwards !important;
      box-shadow: 0 0 14px var(--team-color, rgba(255,255,255,0.5));
    }

    @keyframes progressGrowGlow {
      0% {
        transform: scaleX(0);
        opacity: 0.4;
        box-shadow: 0 0 25px var(--team-color, #fff), 0 0 45px var(--team-color, #fff);
        filter: brightness(1.6);
      }
      60% {
        box-shadow: 0 0 18px var(--team-color, #fff), 0 0 35px var(--team-color, #fff);
        filter: brightness(1.3);
      }
      100% {
        transform: scaleX(1);
        opacity: 1;
        box-shadow: 0 0 8px var(--team-color, transparent);
        filter: brightness(1);
      }
    }

    /* Pulse for leaders */
    .progress-bar.leader,
    .con-bar-fill.leader,
    .tc-bar-fill.leader {
      background: linear-gradient(90deg, var(--team-color, var(--gold)), var(--gold)) !important;
      animation: progressGrowGlow 1.8s cubic-bezier(.2,.8,.2,1) forwards, leaderBarPulse 2s infinite ease-in-out 1.8s !important;
    }

    @keyframes leaderBarPulse {
      0%, 100% {
        box-shadow: 0 0 10px var(--gold, #D4AF37), 0 0 20px var(--team-color, #D4AF37);
        filter: brightness(1);
      }
      50% {
        box-shadow: 0 0 22px var(--gold, #D4AF37), 0 0 42px var(--gold, #D4AF37), 0 0 65px var(--team-color, #D4AF37);
        filter: brightness(1.4);
      }
    }

    /* ── Step 12: F1 Broadcast Timing Tower Gap Visualization ── */
    .gap-visual {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 10, 12, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      vertical-align: middle;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .gap-visual:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .gap-visual.leader-pill {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.25), rgba(10, 10, 12, 0.85));
      border-color: rgba(212, 175, 55, 0.5);
      color: var(--gold, #D4AF37);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.35);
    }
    .gap-visual .gap-indicator {
      width: 4px;
      height: 12px;
      border-radius: 2px;
      background: var(--gold, #D4AF37);
      box-shadow: 0 0 8px var(--gold, #D4AF37);
      animation: telemetryPulseGlow 2s infinite ease-in-out;
    }
    .gap-visual .gap-bar-track {
      width: 44px;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .gap-visual .gap-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1.2s cubic-bezier(.2,.8,.2,1);
    }
    .gap-visual .gap-text {
      color: #fff;
    }
    .gap-visual.leader-pill .gap-text {
      color: var(--gold, #D4AF37);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }
    .drivers-hero,
    .drivers-hero *,
    .drivers-grid-wrap,
    .drivers-grid-wrap *,
    .ticker-wrap,
    .ticker-wrap * {
      color: var(--ink) !important;
    }
    .drivers-title em,
    .tick .sym,
    .dc-view-hint,
    .dm-eyebrow,
    .dm-meta-dot {
      color: var(--racing) !important;
    }
    .tick,
    .tick .val,
    .tick-dot,
    .drivers-desc,
    .drivers-count,
    .nav-link,
    .nav-brand-text {
      color: var(--ink-2) !important;
    }
    .driver-card,
    .driver-card *,
    .team-card,
    .team-card * {
      color: var(--ink) !important;
    }
    .dc-code,
    .dc-view-hint,
    .dm-close-btn,
    .dm-person-name,
    .dm-person-role,
    .dm-name,
    .dm-meta,
    .dm-bio,
    .dm-section-label,
    .dm-stat-num,
    .dm-stat-label,
    .dm-history-table th,
    .dm-history-table td,
    .dm-season-year,
    .dm-season-team,
    .dm-season-pts,
    .tm-spec-label,
    .tm-spec-val {
      color: var(--ink) !important;
    }
    .driver-modal-overlay,
    .team-modal-overlay {
      background: rgba(17, 17, 19, 0.34) !important;
    }
    .dc-code,
    .dc-view-hint {
      color: #fff !important;
    }
    .dm-pos-1,
    .dm-pos-2,
    .dm-pos-3,
    .tm-spec-val strong {
      color: var(--gold) !important;
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="F1_Dashboard.html" class="nav-logo-link">
        <span class="nav-checker"></span>
        <span class="nav-brand-text">Pit <em>Wall</em></span>
      </a>
      <div class="nav-links">
        <a href="F1_Dashboard.html" class="nav-link">Dashboard</a>
        <a href="analytics.html" class="nav-link">Analytics</a>
        <a href="drivers.html" class="nav-link active" aria-current="page">Drivers</a>
        <a href="teams.html" class="nav-link">Teams</a>
      </div>
    </div>
  </nav>

  <!-- Ticker -->
  <div class="ticker-wrap">
    <div class="ticker-track" id="tkTrack"></div>
  </div>

  <!-- Hero -->
  <section class="drivers-hero fade-up" style="animation-delay: 0.1s">
    <div class="drivers-eyebrow">2026 Driver Grid</div>
    <h1 class="drivers-title">Driver <em>Profiles</em></h1>
    <div class="drivers-desc">
      <span>Career statistics · Season history · Full grid</span>
      <span class="drivers-count" id="driversCount">Loading...</span>
    </div>
  </section>

  <!-- Driver Grid -->
  <div class="drivers-grid-wrap fade-up" style="animation-delay: 0.2s">
    <div class="drivers-grid" id="driversGrid">
      <div class="grid-loading">· Loading driver grid ·</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-wrap">
    <footer class="footer">
      <div class="f-note"><span class="f-dot"></span>Lights out and away we go</div>
      <div class="f-brand">The <em>Pit Wall</em></div>
    </footer>
  </div>

  <!-- Driver Detail Modal -->
  <div class="driver-modal-overlay" id="driverModal" role="dialog" aria-modal="true" aria-label="Driver profile">
    <div class="driver-modal" id="driverModalInner">
      <!-- Hero -->
      <div class="dm-hero" id="dm-hero">
        <button class="dm-close-btn" id="dmClose" aria-label="Close profile">✕</button>
        <div class="dm-eyebrow" id="dm-eyebrow">◆ Driver Profile</div>
        <div class="dm-name" id="dm-name">Loading...</div>
        <div class="dm-meta" id="dm-meta"></div>
        <div class="dm-hero-num" id="dm-hero-num"></div>
      </div>
      <!-- Body -->
      <div class="dm-body" id="dm-body">
        <div class="dm-loading">
          <div class="dm-loading-dot"></div>
          <div class="dm-loading-text">Fetching career data</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const t = document.getElementById('tkTrack');
      const mk = () => '<span class="tick"><span class="sym">Driver Grid</span> <span class="val">F1 2026</span></span><span class="tick tick-dot">◆</span>';
      t.innerHTML = Array(14).fill(null).map(mk).join('') + Array(14).fill(null).map(mk).join('');
    })();
  </script>
  <script src="effects.js"></script>
  <script src="drivers.js?v=2"></script>
</body>

</html>
